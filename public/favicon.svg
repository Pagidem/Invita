<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d9a7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d7b77a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a15c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d9a7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d7b77a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a15c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b8965a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Anillo inferior (detrás a la izquierda, delante a la derecha) -->
  <g filter="url(#shadow)">
    <!-- Parte trasera del anillo 1 -->
    <path d="M 25 45 
             A 20 20 0 0 1 65 45
             A 2 2 0 0 1 65 49
             A 16 16 0 0 0 29 49
             A 2 2 0 0 1 25 45 Z" 
          fill="url(#gold1)" />
    
    <!-- Parte delantera del anillo 1 -->
    <path d="M 25 55 
             A 16 16 0 0 0 61 55
             A 2 2 0 0 0 61 51
             A 20 20 0 0 1 29 51
             A 2 2 0 0 0 25 55 Z" 
          fill="url(#gold1)" />
  </g>
  
  <!-- Anillo superior (delante a la izquierda, detrás a la derecha) -->
  <g filter="url(#shadow)">
    <!-- Parte delantera del anillo 2 -->
    <path d="M 35 35 
             A 20 20 0 0 0 75 35
             A 2 2 0 0 0 75 39
             A 16 16 0 0 1 39 39
             A 2 2 0 0 0 35 35 Z" 
          fill="url(#gold2)" />
    
    <!-- Parte trasera del anillo 2 -->
    <path d="M 35 45 
             A 16 16 0 0 1 71 45
             A 2 2 0 0 1 71 41
             A 20 20 0 0 0 39 41
             A 2 2 0 0 1 35 45 Z" 
          fill="url(#gold2)" />
  </g>
  
  <!-- Brillos en los anillos -->
  <ellipse cx="38" cy="38" rx="3" ry="1.5" fill="#fff" opacity="0.6" transform="rotate(-30 38 38)"/>
  <ellipse cx="58" cy="48" rx="3" ry="1.5" fill="#fff" opacity="0.6" transform="rotate(-30 58 48)"/>
  <ellipse cx="45" cy="52" rx="2" ry="1" fill="#fff" opacity="0.5" transform="rotate(30 45 52)"/>
  <ellipse cx="65" cy="42" rx="2" ry="1" fill="#fff" opacity="0.5" transform="rotate(30 65 42)"/>
</svg>